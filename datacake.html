<!DOCTYPE html>

<title>Stations Datacake</title>

<style>

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef2f7;
}

header{
    background:#1f4e79;
    color:white;
    padding:20px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

header h1{
    margin:0;
}

.container{
    max-width:1700px;
    margin:auto;
    padding:25px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(650px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.card h2{
    margin:0;
    padding:15px;
    background:#2c6ca3;
    color:white;
    font-size:22px;
}

iframe{
    width:100%;
    height:700px;
    border:none;
}

footer{
    text-align:center;
    padding:30px;
    color:#666;
}

a.button{
    display:inline-block;
    margin-top:15px;
    padding:10px 18px;
    background:#1f4e79;
    color:white;
    text-decoration:none;
    border-radius:8px;
}

a.button:hover{
    background:#295f92;
}

@media(max-width:700px){

.grid{
grid-template-columns:1fr;
}

iframe{
height:600px;
}

}

</style>

</head>
