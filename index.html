<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Previsions Tn/Tx - Vercors et Bagnols-sur-Ceze</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  #map { height: 100vh; width: 100%; cursor: crosshair; }
  .panel {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: white; padding: 12px 16px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 14px;
  }
  .panel label { display: block; margin: 6px 0; cursor: pointer; }
  .panel h3 { margin: 0 0 8px 0; font-size: 15px; }
  .date-info { font-size: 12px; color: #666; margin-top: 8px; }
  .legend {
    position: absolute; bottom: 20px; left: 10px; z-index: 1000;
    background: white; padding: 8px 12px; border-radius: 6px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); font-size: 12px;
  }
  .legend-gradient {
    width: 200px; height: 14px;
    background: linear-gradient(to right, #8b0057, #6b0068, #4a0070, #2d0078, #1a1a8c, #0000cc, #0022e0, #0044ff, #0066ff, #0099ff, #00ccff, #00eeee, #00ffcc, #00ff88, #33ff33, #88ff00, #ccff00, #ffff00, #ffee00, #ffdd44, #ffbb33, #ff9900, #ff6600, #ee2200, #cc0000);
    border-radius: 3px; margin: 4px 0;
  }
  .legend-labels { display: flex; justify-content: space-between; }
  .temp-tooltip {
    position: absolute; z-index: 1001; pointer-events: none;
    background: rgba(0,0,0,0.8); color: white; padding: 6px 10px;
    border-radius: 6px; font-size: 14px; font-weight: bold;
    display: none;
  }
  .iso-label {
    background: rgba(255,255,255,0.9); border: none; box-shadow: none;
    font-size: 11px; font-weight: bold; color: #333;
  }

.leaflet-overlay-pane { mix-blend-mode: multiply; }
#map.sans-fusion .leaflet-overlay-pane { mix-blend-mode: normal; }
#date-info { font-size: 13px; font-weight: 600; color: #222; }

.commune-label { background: none; border: none; }
.commune-label .cv { display: inline-block; transform: translate(-50%, 3px);
  background: rgba(255,255,255,0.85); border: 1px solid rgba(0,0,0,0.4); border-radius: 4px;
  padding: 0 3px; font: 600 11px/14px Arial, sans-serif; color: #111; white-space: nowrap; }

.commune-label .cv.cs { background: rgba(11,42,111,0.92); color: #fff; border: 1px solid #fff;
  font-size: 12px; line-height: 16px; padding: 0 5px; }
</style>
</head>
<body>

<div id="map"></div>
<div class="temp-tooltip" id="tooltip"></div>

<div class="panel">
  <h3>Couches</h3>
  <label><input type="radio" name="layer" value="tn_vercors" checked> Tn Vercors (nuit)</label>
  <label style="margin-top:10px;"><input type="checkbox" id="toggle-iso" checked> Afficher isolignes (1 °C)</label>
  <label><input type="checkbox" id="toggle-communes" checked> Valeurs sur les communes</label>
  <label><input type="checkbox" id="toggle-mult" checked> Fond visible sous les couleurs</label>
  <div class="date-info" id="date-info">Chargement...</div>
  <div class="date-info">Survolez la carte pour voir la temperature</div>
</div>

<div class="legend">
  <div id="legend-title">Temperature (degC)</div>
  <div class="legend-gradient"></div>
  <div class="legend-labels">
    <span id="legend-min">-5</span>
    <span id="legend-max">20</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const map = L.map('map').setView([44.6, 4.9], 9);

const fondTopo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxNativeZoom: 17, maxZoom: 18,
  attribution: '© OpenStreetMap, SRTM | © OpenTopoMap (CC-BY-SA)'
});
const fondOsm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '© OpenStreetMap'
});
fondTopo.addTo(map);
L.control.layers({'Relief (OpenTopoMap)': fondTopo, 'Routes (OpenStreetMap)': fondOsm}, null, {position: 'topleft'}).addTo(map);

let currentOverlay = null;
let currentIsolignes = null;
let boundsData = {};
let currentLayerId = 'tn_vercors';
let currentGridData = null;
const gridCache = {};
let isoVisible = true;

fetch('bounds.json')
  .then(r => r.json())
  .then(data => {
    boundsData = data;
    showLayer('tn_vercors');
  })
  .catch(err => {
    document.getElementById('date-info').textContent = 'Erreur de chargement des donnees';
  });

function chargerIsolignes(layerId) {
  if (currentIsolignes) {
    map.removeLayer(currentIsolignes);
    currentIsolignes = null;
  }
  if (!isoVisible) return;
  fetch(layerId + '_isolignes.json?t=' + Date.now())
    .then(r => r.json())
    .then(geojson => {
      currentIsolignes = L.geoJSON(geojson, {
       style: function(feature) {
  var maj = feature.properties && feature.properties.majeure;
  return { color: '#000000', weight: maj ? 1.5 : 0.6, opacity: maj ? 0.7 : 0.35 };
},
        onEachFeature: function(feature, layer) {
          if (feature.properties && feature.properties.temp !== undefined) {
            layer.bindTooltip(feature.properties.temp + '°C', {
              permanent: false, direction: 'center', className: 'iso-label'
            });
          }
        }
      }).addTo(map);
    })
    .catch(() => console.log('Isolignes indisponibles pour', layerId));
}

function libelleDate(layerId, ymd) {
  var d = new Date(+ymd.slice(0,4), +ymd.slice(4,6) - 1, +ymd.slice(6,8));
  var d2 = new Date(d); d2.setDate(d2.getDate() + 1);
  var mois = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
  var jour = function(x) { return x.getDate() === 1 ? '1er' : String(x.getDate()); };
  if (layerId.indexOf('tx') === 0) return 'Tx du ' + jour(d2) + ' ' + mois[d2.getMonth()] + ' ' + d2.getFullYear();
  if (d.getMonth() === d2.getMonth()) return 'Tn nuit du ' + jour(d) + ' au ' + jour(d2) + ' ' + mois[d2.getMonth()] + ' ' + d2.getFullYear();
  return 'Tn nuit du ' + jour(d) + ' ' + mois[d.getMonth()] + ' au ' + jour(d2) + ' ' + mois[d2.getMonth()] + ' ' + d2.getFullYear();
}

let communesData = [];
let communesVisibles = true;
const communesGroup = L.layerGroup().addTo(map);

function majCommunes() {
  communesGroup.clearLayers();
  if (!communesVisibles) return;
  var z = map.getZoom();
  var seuil = z <= 9 ? 5000 : (z === 10 ? 1500 : (z === 11 ? 500 : 0));
  communesData.forEach(function(c) { if (c.station || c.pop > seuil) communesGroup.addLayer(c.marker); });
}

function chargerCommunes(layerId) {
  communesGroup.clearLayers();
  communesData = [];
  if (layerId !== 'tn_vercors') return;
  fetch('communes_tn_vercors.json?t=' + Date.now())
    .then(function(r) { return r.json(); })
    .then(function(liste) {
      communesData = liste.map(function(c) {
        var m = L.marker([c.lat, c.lon], {zIndexOffset: c.station ? 1000 : 0,
          icon: L.divIcon({className: 'commune-label', html: (c.station ? '<div class="cv cs"><b>' + c.nom + '</b> ' + c.tn.toFixed(1) + '</div>' : '<div class="cv">' + c.tn.toFixed(1) + '</div>'), iconSize: [0, 0]})
        }).bindTooltip(c.nom + ' — ' + c.tn.toFixed(1) + ' °C' + (c.station ? '' : ' (' + c.pop + ' hab.)'), {direction: 'top'});
        return {pop: c.pop, station: !!c.station, marker: m};
      });
      majCommunes();
    })
    .catch(function() { console.log('Valeurs communales indisponibles'); });
}
map.on('zoomend', majCommunes);

function showLayer(layerId) {
  currentLayerId = layerId;
  if (currentOverlay) {
    map.removeLayer(currentOverlay);
  }
  const info = boundsData[layerId];
  if (!info) {
    document.getElementById('date-info').textContent = 'Donnee non disponible';
    return;
  }
  const bounds = [[info.lat_min, info.lon_min], [info.lat_max, info.lon_max]];
  currentOverlay = L.imageOverlay(layerId + '.png', bounds, { opacity: 0.75 }).addTo(map);

  chargerIsolignes(layerId);

  chargerCommunes(layerId);

  const dateStr = info.date.slice(6,8) + '/' + info.date.slice(4,6) + '/' + info.date.slice(0,4);
  document.getElementById('date-info').textContent = libelleDate(layerId, info.date);
  if (info.vmin !== undefined) {
    document.getElementById('legend-min').textContent = info.vmin + ' °C';
    document.getElementById('legend-max').textContent = info.vmax + ' °C';
    if (info.palette) { document.querySelector('.legend-gradient').style.background = 'linear-gradient(to right, ' + info.palette.join(', ') + ')'; }
  }

  if (layerId === 'tn_vercors') {
    map.setView([45.0, 5.4], 10);
  } else {
    map.setView([44.25, 4.55], 10);
  }

  if (gridCache[layerId]) {
    currentGridData = gridCache[layerId];
  } else {
    currentGridData = null;
    fetch(layerId + '_data.json')
      .then(r => r.json())
      .then(d => {
        gridCache[layerId] = d;
        if (currentLayerId === layerId) currentGridData = d;
      })
      .catch(err => console.log('Pas de donnees survol pour', layerId));
  }
}

document.querySelectorAll('input[name="layer"]').forEach(input => {
  input.addEventListener('change', (e) => showLayer(e.target.value));
});

document.getElementById('toggle-iso').addEventListener('change', (e) => {
  isoVisible = e.target.checked;
  chargerIsolignes(currentLayerId);
});

function getValueAt(lat, lon) {
  if (!currentGridData) return null;
  const d = currentGridData;
  if (lat < d.lat_min || lat > d.lat_max || lon < d.lon_min || lon > d.lon_max) return null;
  const row = Math.floor((d.lat_max - lat) / (d.lat_max - d.lat_min) * d.nrows);
  const col = Math.floor((lon - d.lon_min) / (d.lon_max - d.lon_min) * d.ncols);
  if (row < 0 || row >= d.nrows || col < 0 || col >= d.ncols) return null;
  return d.values[row][col];
}

const tooltip = document.getElementById('tooltip');
map.on('mousemove', function(e) {
  const val = getValueAt(e.latlng.lat, e.latlng.lng);
  if (val !== null && val !== undefined) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.originalEvent.pageX + 14) + 'px';
    tooltip.style.top = (e.originalEvent.pageY + 10) + 'px';
    tooltip.textContent = val.toFixed(1) + ' degC';
  } else {
    tooltip.style.display = 'none';
  }
});

map.on('mouseout', function() {
  tooltip.style.display = 'none';
});

document.getElementById('toggle-mult').addEventListener('change', function(e) {
  document.getElementById('map').classList.toggle('sans-fusion', !e.target.checked);
});

document.getElementById('toggle-communes').addEventListener('change', function(e) {
  communesVisibles = e.target.checked; majCommunes();
});

/* defauts-affichage */
(function() {
  var tm = document.getElementById('toggle-mult');
  if (tm) { tm.checked = false; }
  document.getElementById('map').classList.add('sans-fusion');
})();
</script>

</body>
</html>
