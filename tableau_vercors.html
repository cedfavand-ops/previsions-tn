<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="600">
<title>Previsions Tn Vercors</title>
<style>
  body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; margin: 0; padding: 20px; }
  h1 { color: #00d4ff; text-align: center; font-size: 1.4em; margin-bottom: 5px; }
  .subtitle { text-align: center; color: #aaa; font-size: 0.9em; margin-bottom: 20px; }
  table { width: 100%; max-width: 600px; margin: 0 auto; border-collapse: collapse; }
  th { background: #16213e; color: #00d4ff; padding: 10px; text-align: left; border-bottom: 2px solid #00d4ff; }
  td { padding: 10px 10px; border-bottom: 1px solid #333; }
  tr:hover { background: #16213e; }
  .tn { font-weight: bold; font-size: 1.1em; text-align: center; }
  .froid { color: #00aaff; }
  .tres-froid { color: #aa00ff; }
  .frais { color: #00ffaa; }
  .doux { color: #ffaa00; }
  .chaud { color: #ff4400; }
  .arome { color: #888; font-size: 0.9em; text-align: center; }
  .legende { text-align: center; margin-top: 15px; font-size: 0.8em; color: #888; }
  .nuages { text-align: center; margin: 10px; font-size: 0.9em; color: #aaa; }
  a { color: #00d4ff; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>Previsions Tn - Massif du Vercors</h1>
<div class="subtitle" id="date-titre">Chargement...</div>
<div class="nuages" id="nuages-info"></div>
<table>
  <thead>
    <tr>
      <th>Station</th>
      <th style="text-align:center">Tn prevue</th>
      <th style="text-align:center">AROME brut</th>
    </tr>
  </thead>
  <tbody id="tableau-body">
    <tr><td colspan="3" style="text-align:center">Chargement...</td></tr>
  </tbody>
</table>
<div class="legende">
  <span style="color:#aa00ff">■</span> &lt; 0°C &nbsp;
  <span style="color:#00aaff">■</span> 0-5°C &nbsp;
  <span style="color:#00ffaa">■</span> 5-10°C &nbsp;
  <span style="color:#ffaa00">■</span> 10-18°C &nbsp;
  <span style="color:#ff4400">■</span> &gt; 18°C
</div>
<div class="legende" style="margin-top:15px">
  <a href="index.html">← Carte interactive</a>
</div>

<script>
function couleur(tn) {
  if (tn < 0) return "tres-froid";
  if (tn < 5) return "froid";
  if (tn < 10) return "frais";
  if (tn < 18) return "doux";
  return "chaud";
}

fetch("tableau_vercors.json?t=" + Date.now())
  .then(r => r.json())
  .then(data => {
    const d = new Date(data.date);
    document.getElementById("date-titre").textContent =
      "Nuit du " + d.toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long", year:"numeric"});

    if (data.nuages !== null && data.nuages !== undefined) {
      const rad = data.nuages < 10 ? "Nuit tres radiative ★★★" :
                  data.nuages < 30 ? "Nuit radiative ★★" :
                  data.nuages < 60 ? "Nuit partiellement nuageuse ★" : "Nuit nuageuse";
      document.getElementById("nuages-info").textContent =
        "Couverture nuageuse prevue: " + data.nuages + "% — " + rad;
    }

    const tbody = document.getElementById("tableau-body");
    tbody.innerHTML = "";
    const stations = data.stations.sort((a,b) => a.tn_predite - b.tn_predite);
    for (const s of stations) {
      const cl = couleur(s.tn_predite);
      const nom = s.station.replace(/_/g, " ");
      tbody.innerHTML += `<tr>
        <td>${nom}</td>
        <td class="tn ${cl}">${s.tn_predite}°C</td>
        <td class="arome">${s.tn_arome}°C</td>
      </tr>`;
    }
  })
  .catch(() => {
    document.getElementById("tableau-body").innerHTML =
      "<tr><td colspan='3' style='text-align:center;color:#f44'>Donnees indisponibles</td></tr>";
  });
</script>
</body>
</html>
